<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>Ingresos</title>
</head>

<body>

    <h1>Registrar vehículo</h1>

    <form action="/ingresos" method="POST">

        <input
            type="text"
            name="patente"
            placeholder="Ingrese patente"
            required
        >

        <button type="submit">
            Guardar
        </button>

    </form>

    <hr>

    <h2>Vehículos ingresados</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Patente</th>
            <th>Fecha ingreso</th>
        </tr>

        {% for ingreso in ingresos %}

        <tr>

            <td>{{ ingreso.id }}</td>

            <td>{{ ingreso.patente }}</td>

            <td>{{ ingreso.fecha_ingreso }}</td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
